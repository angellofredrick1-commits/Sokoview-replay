[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Capture monitor lives at /capture — must come before the SPA catch-all,
# which is evaluated top-down and would otherwise swallow it.
[[redirects]]
  from = "/capture"
  to = "/capture.html"
  status = 200

# SPA fallback for the replayer.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
