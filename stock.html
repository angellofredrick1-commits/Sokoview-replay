<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Signed-in only. No Supabase session in this browser: go to sign-in first and come back here after.
      // Skipped when the site isn't connected to Supabase (sample mode), where nobody could sign in.
      (function () { try { if ('%VITE_SUPABASE_URL%'.indexOf('http') !== 0) return; for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (/^sb-.+-auth-token$/.test(k) && localStorage.getItem(k)) return; } document.documentElement.style.visibility = 'hidden'; location.replace('/portfolio?next=' + encodeURIComponent(location.pathname + location.search)); } catch (e) {} })();
    </script>
    <script>
      // Theme before first paint, so dark-mode visitors never see a white flash.
      (function () { try { var t = localStorage.getItem('sv.theme'); if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; var d = document.documentElement; d.dataset.theme = t; d.style.colorScheme = t; } catch (e) {} })();
    </script>
    <title>Sokoview · Stocks</title>
    <meta name="description" content="Price history, liquidity and dividends for every DSE-listed stock." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body><div id="root"></div><script type="module" src="/src/stock-main.jsx"></script></body>
</html>
