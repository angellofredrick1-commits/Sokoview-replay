<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <script>
      // Theme before first paint, so dark-mode visitors never see a white flash.
      (function () { try { var t = localStorage.getItem('sv.theme'); if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; var d = document.documentElement; d.dataset.theme = t; d.style.colorScheme = t; } catch (e) {} })();
    </script>
    <title>Sokoview · Portfolio</title>
    <meta name="description" content="Track your DSE holdings, gains and dividend income from the trades you enter." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body><div id="root"></div><script type="module" src="/src/portfolio-main.jsx"></script></body>
</html>
